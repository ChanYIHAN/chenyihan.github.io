name: Supabase Keep Alive

on:
  schedule:
    # Every 6 hours; minute 37 avoids the busiest scheduling period.
    - cron: '37 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/supabase-keepalive.yml'

permissions: {}

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read one public portfolio item
        env:
          SUPABASE_URL: https://zgyhnlsfyytjunktsefz.supabase.co
          # Public browser key already used in portfolio-loader.js.
          # This is not a service_role key.
          SUPABASE_KEY: sb_publishable_dGK7GApR2snMW5qtqdC7WQ_i3CvIX33
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 2 \
            --output /dev/null \
            --header "apikey: ${SUPABASE_KEY}" \
            "${SUPABASE_URL}/rest/v1/portfolio_items?select=id&is_visible=eq.true&limit=1"
          echo "Public database query succeeded."
