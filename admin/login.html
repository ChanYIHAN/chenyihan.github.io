<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 作品集管理后台</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080b12;
      --surface: rgba(18, 23, 34, 0.86);
      --surface-solid: #121722;
      --border: rgba(255,255,255,0.1);
      --accent: #63e6d3;
      --accent-hover: #79f4e2;
      --accent-2: #7c6af7;
      --text: #f5f7fb;
      --text-muted: #9299ad;
      --error: #f87171;
      --radius: 18px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 28px;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 42px 42px;
    }

    /* 背景光晕 */
    body::before {
      content: '';
      position: fixed;
      top: -26%;
      left: -8%;
      width: 720px;
      height: 720px;
      background: radial-gradient(circle, rgba(99,230,211,0.13) 0%, transparent 68%);
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -20%;
      right: -10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(124,106,247,0.14) 0%, transparent 70%);
      pointer-events: none;
    }

    .login-shell {
      width: min(980px, 100%);
      min-height: 590px;
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(360px, .85fr);
      background: rgba(10,14,22,.72);
      border: 1px solid var(--border);
      border-radius: 28px;
      overflow: hidden;
      position: relative;
      z-index: 1;
      box-shadow: 0 40px 100px rgba(0,0,0,.46);
      backdrop-filter: blur(24px);
    }

    .brand-panel {
      padding: 54px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 12%, rgba(99,230,211,.15), transparent 32%),
        linear-gradient(145deg, rgba(20,30,42,.96), rgba(14,17,27,.98));
      border-right: 1px solid var(--border);
    }
    .brand-panel::after {
      content: '';
      position: absolute;
      width: 360px;
      height: 360px;
      right: -150px;
      bottom: -170px;
      border: 1px solid rgba(99,230,211,.18);
      border-radius: 50%;
      box-shadow: 0 0 0 42px rgba(99,230,211,.025), 0 0 0 84px rgba(124,106,247,.025);
    }
    .brand-mark {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: #07110f;
      font-size: 21px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent), #a7f3e8);
      box-shadow: 0 12px 30px rgba(99,230,211,.22);
    }
    .brand-copy { position: relative; z-index: 1; }
    .brand-kicker {
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 15px;
    }
    .brand-copy h2 {
      max-width: 450px;
      font-size: clamp(34px, 4vw, 52px);
      line-height: 1.08;
      letter-spacing: -2px;
      margin-bottom: 18px;
    }
    .brand-copy p {
      max-width: 440px;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.8;
    }
    .brand-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text-muted);
      font-size: 12px;
      position: relative;
      z-index: 1;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 5px rgba(99,230,211,.1);
    }

    .login-card {
      background: var(--surface);
      padding: 54px 46px;
      width: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .login-logo {
      text-align: left;
      margin-bottom: 34px;
    }
    .login-logo .icon {
      display: none;
    }
    .login-logo h1 {
      font-size: 28px;
      font-weight: 750;
      letter-spacing: -1px;
    }
    .login-logo p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 9px;
    }

    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #b4bacb;
      margin-bottom: 8px;
      letter-spacing: 0.3px;
    }
    .form-group input {
      width: 100%;
      background: rgba(5,8,14,.72);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 15px;
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99,230,211,0.12);
    }
    .form-group input::placeholder {
      color: #555d70;
    }

    .btn-login {
      width: 100%;
      background: linear-gradient(135deg, #57dcca, var(--accent));
      border: none;
      border-radius: 12px;
      padding: 14px;
      color: #07110f;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.2s, transform 0.1s;
      letter-spacing: 0.5px;
    }
    .btn-login:hover { transform: translateY(-1px); box-shadow: 0 14px 30px rgba(99,230,211,.16); }
    .btn-login:active { transform: scale(0.99); }
    .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }

    .error-msg {
      background: rgba(248,113,113,0.1);
      border: 1px solid rgba(248,113,113,0.3);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--error);
      font-size: 13px;
      margin-top: 16px;
      display: none;
    }
    .error-msg.show { display: block; }

    .login-footer {
      text-align: left;
      margin-top: 24px;
      font-size: 12px;
      color: #61697b;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .login-footer::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fbbf24;
    }

    @media (max-width: 820px) {
      body { padding: 18px; overflow-y: auto; }
      .login-shell { grid-template-columns: 1fr; min-height: auto; }
      .brand-panel { min-height: 260px; padding: 34px; border-right: 0; border-bottom: 1px solid var(--border); }
      .brand-copy h2 { font-size: 36px; max-width: 360px; }
      .brand-copy p { display: none; }
      .login-card { padding: 38px 32px 42px; }
    }

    @media (max-width: 480px) {
      body { padding: 0; align-items: stretch; }
      .login-shell { border-radius: 0; border: 0; min-height: 100vh; }
      .brand-panel { min-height: 220px; padding: 28px 24px; }
      .brand-copy h2 { font-size: 31px; }
      .login-card { padding: 36px 24px; }
    }
  </style>
</head>
<body>
  <main class="login-shell">
    <section class="brand-panel" aria-label="内容管理工作台介绍">
      <div class="brand-mark">CY</div>
      <div class="brand-copy">
        <div class="brand-kicker">Portfolio Content Studio</div>
        <h2>把好作品，放在最值得被看见的位置。</h2>
        <p>统一维护图文、视频、IP 案例与策划方案，让你的在线作品集始终保持最新状态。</p>
      </div>
      <div class="brand-meta"><span class="status-dot"></span>陈奕翰 · Portfolio CMS</div>
    </section>

    <section class="login-card">
      <div class="login-logo">
        <div class="icon">✦</div>
        <h1>欢迎回来</h1>
        <p>登录后继续管理你的作品集内容</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">管理员邮箱</label>
          <input type="email" id="username" placeholder="请输入管理员邮箱" autocomplete="username" required autofocus>
        </div>
        <div class="form-group">
          <label for="password">登录密码</label>
          <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-login" id="loginBtn">进入管理后台</button>
        <div class="error-msg" id="errorMsg" role="alert">账号或密码错误，请重新输入</div>
      </form>

      <div class="login-footer">仅限管理员访问，请勿在公共设备保存密码</div>
    </section>
  </main>

  <script>
    // 浏览器端只保留公开 anon key；权限由 Auth 会话与 RLS 控制
    const SUPABASE_CONFIG = {
      url: 'https://zgyhnlsfyytjunktsefz.supabase.co',
      anonKey: 'sb_publishable_dGK7GApR2snMW5qtqdC7WQ_i3CvIX33'
    };

    if (sessionStorage.getItem('admin_access_token') && sessionStorage.getItem('admin_role') === 'admin') {
      location.href = 'index.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('errorMsg');

      btn.disabled = true;
      btn.textContent = '正在验证...';
      err.classList.remove('show');

      try {
        const response = await fetch(`${SUPABASE_CONFIG.url}/auth/v1/token?grant_type=password`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_CONFIG.anonKey
          },
          body: JSON.stringify({ email, password })
        });
        const data = await response.json().catch(() => ({}));
        const role = data.user?.app_metadata?.role;

        if (!response.ok || !data.access_token || role !== 'admin') {
          throw new Error('账号、密码或管理员权限验证失败');
        }

        sessionStorage.setItem('admin_access_token', data.access_token);
        sessionStorage.setItem('admin_refresh_token', data.refresh_token || '');
        sessionStorage.setItem('admin_expires_at', String(Math.floor(Date.now() / 1000) + (data.expires_in || 3600)));
        sessionStorage.setItem('admin_role', role);
        sessionStorage.setItem('admin_user', data.user.email || email);
        location.href = 'index.html';
      } catch (error) {
        err.textContent = error.message || '登录失败，请稍后重试';
        err.classList.add('show');
        btn.disabled = false;
        btn.textContent = '进入管理后台';
      }
    });
  </script>
</body>
</html>
